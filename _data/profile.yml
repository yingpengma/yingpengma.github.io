short_bio_text_justify: false
short_bio: >-
  <div style="margin-bottom: 1em; text-align: center; font-family: 'Trajan', serif; font-size: 22px; font-weight: bold; color: #333; font-style: italic;">
  Imagination will take you everywhere.
  </div>
  <p>
    Hello, I'm <green>Yingpeng Ma (马英鹏)</green>. I study <green>AI-Driven Interactive Narrative</green>.
  </p>
  <p>
    Recently, I have focused on designing <green>AI Characters</green> that are grounded in narrative logic, consistent in personality, and emotionally resonant.
  </p>
  <p>
    I'm currently an M.S. student in Computer Science at the <green>NLP$^2$CT Lab</green> <img src='./assets/images/logo/nlp2ct.png' style='width: 2em;'>, <green>University of Macau (澳门大学)</green>, advised by <a href="https://www.fst.um.edu.mo/personal/derek-wong/"  target="_blank">Prof. Derek F. Wong (黃輝)</a>.
  </p>

miscellaneous_text_justify: false
miscellaneous: >-
  <p>
    Previously, I was a Research Assistant at the <green>Westlake NLP Lab</green> <img src='./assets/images/logo/westlake_logo.png' style='width: 4em;'>, supervised by <a href="https://frcchang.github.io/"  target="_blank">Prof. Yue Zhang (张岳)</a> and <a href="https://yanglinyi.github.io/"  target="_blank">Prof. Linyi Yang (杨林易)</a>. 
  </p>
  <p>
    I earned my B.E. degree from <green>Northwestern Polytechnical University</green> (西北工业大学)  <img src='./assets/images/logo/nwpu_logo.png' style='width: 6em;'>, supervised by <a href="https://hellloxiaotian.github.io/"  target="_blank">Prof. Chunwei Tian (田春伟)</a>. 
  </p>
  <p>
    In addition to my advisors, I am also deeply indebted to the guidance and support of my senior labmates: <a href="https://elliottyan.github.io/"  target="_blank">Jianhao Yan (颜建昊)</a>, <a href="https://cylnlp.github.io/"  target="_blank">Dr. Yulong Chen (陈雨龙)</a>, <a href="https://runzhe.me/"  target="_blank">Dr. Runzhe Zhan (詹润哲)</a>, and <a href="https://yafuly.github.io/yafuly/"  target="_blank">Dr. Yafu Li (李雅夫)</a>. Their pursuit of excellence continues to motivate and guide my academic journey.
  </p>
  <p>
    Last but not least, I am grateful to my girlfriend, <span style="color: #FF8C00;">Runnan Wang (王润楠)</span> 🍊, for her unwavering love and companionship.
  </p>

